[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlense"
version = "0.1.0"
description = "GitHub OSINT and authorized repository security analysis CLI"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Anshuman Tiwari" }]
license = { text = "MIT" }
dependencies = [
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
gitlense = "gitlense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
